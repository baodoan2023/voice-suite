[project]
name = "voice-suite"
version = "0.1.0"
description = "Speech-translation eval harness for my-2nd-voice (vi→en, audio→audio)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "typer>=0.12",
    "jiwer>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
ingest = ["datasets>=2.20,<3.0", "soundfile>=0.12", "librosa>=0.10", "numpy>=1.26"]
bt = ["faster-whisper>=1.0"]

[project.scripts]
voice-suite = "voice_suite.cli:app"

[tool.pytest.ini_options]
markers = ["live: tests that need models, audio hardware, or a live API; deselected by default"]
addopts = "-m 'not live'"
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_suite*"]
